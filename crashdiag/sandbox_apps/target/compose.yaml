services:
  app:
    build:
      context: ${CRASHDIAG_REPO_ROOT:?repo root required}
      dockerfile: crashdiag/sandbox_apps/target/Dockerfile
    image: crashdiag-victim:local
    labels:
      crashdiag.role: victim
      crashdiag.session: "${CRASHDIAG_SESSION_ID:?session id required}"
    environment:
      CRASHDIAG_VICTIM_ROOT: /var/lib/crashdiag
      CRASHDIAG_DISK_ROOT: /tmp/crashdiag-disk
    tmpfs:
      - /tmp/crashdiag-disk:size=16m,mode=1777
      - /var/lib/crashdiag:size=8m,mode=1777
    init: true
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 96m
    cpus: 0.5
    networks:
      - victim

networks:
  victim:
    internal: true
    name: crashdiag-victim-${CRASHDIAG_SESSION_ID}
